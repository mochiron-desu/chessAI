[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslab"
version = "0.1.0"
description = "Reproducible CPU-native Chess AI research from scratch on PGN data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chess AI Researcher" }]
dependencies = [
    "torch>=2.2.0",
    "python-chess>=1.10.0",
    "zstandard>=0.22.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0"
]

[tool.setuptools.packages.find]
where = ["src"]
